<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blessy — Каталог</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-gray-800 font-Manrope flex flex-col min-h-screen">

  <!-- Header -->
  <header class="bg-white shadow-md fixed top-0 w-full z-50">
    <div class="max-w-screen-xl mx-auto flex items-center justify-between px-6 py-4">
      <div class="text-2xl font-extrabold text-blue-800">Blessy</div>
      <nav class="hidden md:flex space-x-6 font-semibold text-gray-700">
        <a href="index.html" class="hover:text-blue-800">Главная</a>
        <a href="catalog.html" class="text-blue-800 font-extrabold">Каталог</a>
        <a href="about.html" class="hover:text-blue-800">О нас</a>
        <a href="contact.html" class="hover:text-blue-800">Контакты</a>
        <a href="blog.html" class="hover:text-blue-800">Блог</a>
        <a href="cart.html" class="hover:text-blue-800">Корзина</a>
        <a href="account.html" class="hover:text-blue-800">Аккаунт</a>
      </nav>
      <button id="menu-btn" class="md:hidden focus:outline-none text-gray-700" aria-label="Toggle menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>
    <div id="mobile-menu" class="hidden bg-white border-t px-6 py-4 space-y-2 text-gray-700 font-semibold md:hidden">
      <a href="index.html" class="block hover:text-blue-800">Главная</a>
      <a href="catalog.html" class="block text-blue-800 font-extrabold">Каталог</a>
      <a href="about.html" class="block hover:text-blue-800">О нас</a>
      <a href="contact.html" class="block hover:text-blue-800">Контакты</a>
      <a href="blog.html" class="block hover:text-blue-800">Блог</a>
      <a href="cart.html" class="block hover:text-blue-800">Корзина</a>
      <a href="account.html" class="block hover:text-blue-800">Аккаунт</a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow pt-24 pb-8 px-4 sm:px-6 lg:px-8">
    <h2 class="text-3xl font-extrabold text-center text-blue-800 mb-8">Каталог товаров</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <script>
        const products = [
          {brand: 'Blessy', name: 'Футболка с космическим принтом', image: 'images/1-min.jpg', price: 7800},
          {brand: 'Blessy', name: 'Рубашка с тропическим принтом', image: 'images/2-min.jpg', price: 7500},
          {brand: 'Blessy', name: 'Рубашка с винтажным цветочным узором', image: 'images/3-min.jpg', price: 12000},
          {brand: 'Blessy', name: 'Рубашка с веткой сакуры', image: 'images/4-min.jpg', price: 6500},
          {brand: 'Blessy', name: 'Рубашка в тёмно-синем флоральном стиле', image: 'images/5-min.jpg', price: 5000},
          {brand: 'Blessy', name: 'Вельветовая рубашка двуцветная', image: 'images/6-min.jpg', price: 20000},
          {brand: 'Blessy', name: 'Льняные брюки с вышивкой', image: 'images/7-min.jpg', price: 15000},
          {brand: 'Blessy', name: 'Юбка с принтом «Коты»', image: 'images/8-min.jpg', price: 25000},
          {brand: 'Blessy', name: 'Льняная рубашка', image: 'images/9-min.jpg', price: 20000},
          {brand: 'Blessy', name: 'Клетчатая рубашка', image: 'images/10-min.jpg', price: 10000},
          {brand: 'Blessy', name: 'Рубашка с воротником-стойкой', image: 'images/11-min.jpg', price: 18000},
          {brand: 'Blessy', name: 'Рубашка с графическим принтом', image: 'images/12-min.jpg', price: 13500}
        ];
        document.write(products.map(p => `
          <div class="bg-white rounded-2xl border border-blue-200 p-6 flex flex-col justify-between shadow hover:shadow-md transition">
            <div>
              <div class="border border-gray-300 rounded-xl overflow-hidden">
                <img src="${p.image}" alt="${p.name}" class="w-full h-auto block" />
              </div>
              <p class="mt-4 text-xs text-gray-500">${p.brand}</p>
              <h3 class="mt-2 text-lg font-semibold text-gray-900">${p.name}</h3>
              <div class="mt-2 flex items-center">
                ${'<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.957a1 1 0 00.95.690h4.162c.969 0 1.371 1.240.588 1.810l-3.370 2.455a1 1 0 00-.364 1.118l1.287 3.957c.300.921-.755 1.688-1.538 1.118l-3.370-2.455a1 1 0 00-1.176 0l-3.370 2.455c-.783.570-1.838-.197-1.538-1.118l1.287-3.957a1 1 0 00-.364-1.118L2.073 9.384c-.783-.570-.380-1.810.588-1.810h4.162a1 1 0 00.950-.690l1.286-3.957z"/></svg>'.repeat(5)}
              </div>
            </div>
            <div class="mt-4 flex items-center justify-between">
              <p class="text-xl font-bold text-blue-800">${p.price.toLocaleString()} ₸</p>
              <button onclick="addToCart('${p.name}', ${p.price}, '${p.image}')" class="bg-blue-100 rounded-full p-3 hover:bg-blue-200 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-blue-800" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="9" cy="21" r="1"></circle>
                  <circle cx="20" cy="21" r="1"></circle>
                  <path d="M1 1h4l2.68 13.39a1 1 0 0 0 1 .81h9.72a1 1 0 0 0 .97-.757L23 6H6"></path>
                </svg>
              </button>
            </div>
          </div>
        `).join(''));
      </script>
    </div>
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-4 right-4 bg-green-500 text-white text-sm px-4 py-2 rounded-lg shadow-lg opacity-0 transition-opacity duration-300 z-50">
    Товар добавлен в корзину!
  </div>

  <!-- Footer -->
  <footer class="bg-gray-900 text-white text-center text-sm py-4 mt-auto">
    © 2025 Blessy. Все права защищены.
  </footer>

  <!-- Scripts -->
  <script>
    function addToCart(name, price, image) {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart.push({ name, price, image });
      localStorage.setItem('cart', JSON.stringify(cart));

      const toast = document.getElementById('toast');
      toast.textContent = `«${name}» добавлен в корзину`;
      toast.classList.add('opacity-100');
      setTimeout(() => toast.classList.remove('opacity-100'), 3000);
    }

    document.getElementById('menu-btn').addEventListener('click', () => {
      document.getElementById('mobile-menu').classList.toggle('hidden');
    });
  </script>

</body>
</html>
