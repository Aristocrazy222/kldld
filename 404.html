<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Страница не найдена</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family:'Manrope',sans-serif; background:#f8f9fa; margin:0; display:flex; align-items:center; justify-content:center; height:100vh; text-align:center; }
    .container { animation:fadeIn 1s ease-out; }
    @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
  </style>
</head>
<body>
  <div class="container px-6">
    <h1 class="text-9xl font-extrabold text-blue-800">404</h1>
    <p class="text-2xl font-semibold mt-4">Упс! Страница не найдена.</p>
    <p class="mt-2 text-gray-600">Возможно, она была удалена или вы ошиблись в адресе.</p>
    <a href="index.html" class="inline-block mt-6 px-5 py-3 bg-blue-800 text-white rounded-lg hover:bg-blue-700 transition">Вернуться на главную</a>
  </div>
</body>
</html>
